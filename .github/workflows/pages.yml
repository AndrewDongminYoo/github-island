name: Playground

# Publishes the playground page to GitHub Pages. The site is the page plus the
# renderer modules it runs in the browser, copied by tools/playground.py.
on:
  push:
    branches: [main]
    paths:
      - playground/**
      - src/github_island/**
      - tools/playground.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

# One deployment at a time; a queued one waits so that the newest build wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'AndrewDongminYoo/github-island' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/playground.py _site
        env:
          PREVIEW_API_URL: ${{ vars.PREVIEW_API_URL }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
