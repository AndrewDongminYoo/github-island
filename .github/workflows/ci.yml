name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull requests share one group per ref so a newer push cancels the older run.
# Every other event gets a group of its own, so no push to main or dispatch is
# superseded while pending.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_*.mjs
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools
