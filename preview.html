<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Profile preview</title>
    <style>
      body {
        margin: 0;
        background: #0d1117;
        color: #e6edf3;
        font: 14px/1.4 sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: repeat(3, 600px);
      }
      figure {
        margin: 0;
      }
      img {
        display: block;
        width: 600px;
      }
      figcaption {
        padding: 4px 14px 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <img src="examples/quiet.svg" alt="" />
        <figcaption><b>Quiet</b>: 0.1, 0.1, 0.2, 0.2, 0</figcaption>
      </figure>
      <figure>
        <img src="examples/builder.svg" alt="" />
        <figcaption><b>Mostly pull requests</b>: 0.95, 0.2, 0.3, 0.4, 0</figcaption>
      </figure>
      <figure>
        <img src="examples/reviewer.svg" alt="" />
        <figcaption><b>Mostly reviews</b>: 0.25, 0.95, 0.5, 0.3, 0.34</figcaption>
      </figure>
      <figure>
        <img src="examples/island.svg" alt="" />
        <figcaption><b>Balanced</b>: 0.65, 0.65, 0.6, 0.6, 0.34</figcaption>
      </figure>
      <figure>
        <img src="examples/maintainer.svg" alt="" />
        <figcaption><b>Many stars and forks</b>: 0.5, 0.4, 0.4, 1, 1</figcaption>
      </figure>
      <figure>
        <img src="examples/full.svg" alt="" />
        <figcaption><b>Everything</b>: 1, 1, 1, 1, 1</figcaption>
      </figure>
    </main>
  </body>
</html>
